name: DevSecOps Zero-Trust Audit (LKSYS)

on:
  pull_request:
    branches: [ "main", "production" ]

jobs:
  secagent_audit:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: 🛡️ LKSYS SecAgent - LLM Code Audit
        uses: actions/github-script@v6
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # Configúralo en los secretos de tu repo
        with:
          script: |
            const fs = require('fs');
            
            // 1. Recopilar archivos modificados en la Pull Request
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            let codeToAudit = '';
            for (const file of files) {
              if (file.filename.endsWith('.js') || file.filename.endsWith('.gs') || file.filename.endsWith('.json')) {
                const content = fs.readFileSync(file.filename, 'utf8');
                codeToAudit += `\n--- FILE: ${file.filename} ---\n${content.substring(0, 3000)}`;
              }
            }
            
            if(!codeToAudit.trim()) { 
              console.log("No scripts to audit."); 
              return; 
            }

            // 2. Llamada asíncrona al motor de IA para auditoría
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${process.env.GEMINI_API_KEY}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: `Realiza una auditoría Zero-Trust de ciberseguridad sobre este código de Pull Request. Busca claves expuestas, inyecciones lógicas y fallos de DevSecOps. Responde en Markdown:\n${codeToAudit}` }] }]
              })
            });
            
            const result = await response.json();
            const auditReport = result.candidates[0].content.parts[0].text;
            
            // 3. Comentar los hallazgos directamente en la Pull Request de GitHub
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### 🛡️ Reporte DevSecOps LKSYS SecAgent\n\n${auditReport}\n\n*Auditoría generada automáticamente en el Pipeline CI/CD.*`
            });
